name: Test and security checks

on:
  push:
    branches: [master, main, "audit-*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[api,dev]"
      - name: Syntax check
        run: python -m compileall -q agents jtag_lockout cli.py simulator.py enrichment.py
      - name: Tests
        run: python -m pytest -q
      - name: Packaging smoke test
        run: |
          jtag-lockout-agent --help
          jtag-boundary-scan-lockout-engine --help
      - name: Verify audit integrity
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript tests
        run: node --test tests/browser.test.cjs
